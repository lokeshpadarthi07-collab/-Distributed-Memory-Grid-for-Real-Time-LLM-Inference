[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-memory-grid"
version = "0.2.0"
description = "Enterprise Distributed Memory Grid for Real-Time LLM Inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zaalima Development Team - Project 1"}
]
dependencies = [
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
